name: Python regression tests

concurrency:
  group: math-mcts-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile modules
        run: python -m compileall -q math_mcts tests
      - name: Core MCTS tests
        run: python tests/test_mcts.py
      - name: Ground Horn closure and guided MCTS adversarial tests
        run: python tests/test_mcts_v2.py
      - name: Generic lazy UCT and delta-index adversarial tests
        run: python tests/test_generic_search_v4.py
      - name: Complete-corpus runtime and per-state retrieval adversarial tests
        run: python tests/test_indexed_mcts.py
      - name: Build ALL imported knowledge and exercise dynamic MCTS retrieval
        if: matrix.python-version == '3.12'
        run: |
          python tools/build_search_index.py --db full_corpus.sqlite --summary full_index_status.json
          python tools/benchmark_indexed_mcts.py --db full_corpus.sqlite --iterations 80 --depth 6 --output full_corpus_mcts_benchmark.json
      - name: Publish complete-corpus usage evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: full-corpus-mcts-usage
          path: |
            full_index_status.json
            full_corpus_mcts_benchmark.json
      - name: Measure generic delta-index and wide-action memory proxy
        run: |
          python tools/benchmark_generic_v4.py --chain 100 --width 60000 --iterations 15 --output mcts_generic_v4_benchmark.json
          python - <<'PY'
          import json
          x=json.load(open("mcts_generic_v4_benchmark.json"))
          assert x["chain"]["exact_edge_sets_equal"]
          assert x["chain"]["proof_replayed"]
          assert x["chain"]["activated_rule_checks"] <= 103
          assert x["chain"]["avoided_rule_checks"] >= 4000
          a=x["wide_branching"]["methods"]
          assert a["eager"]["candidate_actions_materialized"]==60000
          assert a["stream"]["candidate_actions_materialized"]==0
          assert 0 < a["stream"]["candidate_actions_yielded"] <= 15
          assert a["stream"]["actual_simulations"]==15
          print("Verified delta-index correctness and bounded stream enumeration")
          PY
      - name: Semi-naive vs reference Horn graph differential tests
        run: python tests/test_incremental_graph.py
      - name: Generic incremental graph benchmark with exact-edge parity
        run: |
          python tools/benchmark_incremental_graph.py --repetitions 3 --depth 80 --breadth 45 --output incremental_graph_benchmark.json
          python - <<'PY'
          import json
          x=json.load(open("incremental_graph_benchmark.json"))
          assert len(x["cases"])>=5
          for name,case in x["cases"].items():
              assert case["exact_edge_agreement"],name
              assert case["ground_edges"]>=0
          print("Verified same ground hyperedges; speed not assumed")
          PY
      - name: Compare proven closure to bounded UCT and guided PUCT
        run: |
          python tools/benchmark_mcts_v2.py --iterations 180 --output mcts_v2_benchmark.json
          python - <<'PY'
          import json
          report=json.load(open("mcts_v2_benchmark.json"))
          for name,case in report["cases"].items():
              assert case["graph_complete"], name
              result={item["method"]: item for item in case["results"]}
              assert result["event_driven_closure"]["solved"], name
              for method in ("plain_uct","plain_uct_early_stop","guided_puct_no_stop","guided_puct"):
                  if result[method]["solved"]:
                      assert result[method]["certificate_replayed"],(name,method)
                  assert result[method]["actual_simulations"]<=180
          print("MCTS-v2 measured baselines and replay checks passed")
          PY
      - name: Evidence-first knowledge expansion and research-operator tests
        run: |
          python tests/test_expansion.py
          python tests/test_literature_bridge.py
          python tests/test_source_adapters.py
      - name: Field inventory taxonomy and cross-branch MCTS adversarial tests
        run: |
          python tests/test_field_inventory_v7.py
          python tools/ai_knowledge_cli.py ingest examples/field_replenishment_v1.json --db field_supplements.sqlite
          python tools/ai_knowledge_cli.py inventory --db field_supplements.sqlite > field_ai_inventory.json
          python tools/audit_fields.py --output field_audit_unindexed.json --markdown field_audit_unindexed.md --ai-pack examples/field_replenishment_v1.json
          python - <<'PY'
          import json
          a=json.load(open("field_audit_unindexed.json"))
          b=json.load(open("field_ai_inventory.json"))
          assert a["taxonomy_fields"]==49, a
          assert a["domain_count"]==7, a
          assert a["ai_proposals_total_separate"]==35, a
          assert b["unreviewed_ai_candidates"]==35,b
          assert b["curated_promotions"]==0 and b["independent_proofs_verified"]==0
          assert all(row["indexed_imported_records"] is None for row in a["fields"])
          assert all(row["independent_theorem_proof_count"] is None for row in a["fields"])
          print("49-field/35-candidate inventory, cross-branch MCTS, and non-promotion checks passed")
          PY
      - name: AI-to-MCTS knowledge pack, immutable provenance and actual MCTS integration
        run: |
          python tests/test_ai_knowledge_bridge.py
          python tools/ai_knowledge_cli.py ingest examples/ai_knowledge_seed_v1.json --db ai_candidates.sqlite
          python tools/ai_knowledge_cli.py inventory --db ai_candidates.sqlite > ai_inventory.json
          python tools/ai_knowledge_cli.py search "Lagrange" --db ai_candidates.sqlite --limit 10 > ai_search.json
          python tools/ai_knowledge_cli.py collide --db ai_candidates.sqlite --limit 30 --iterations 1000 > ai_pairs.json
          python - <<'PY'
          import json
          inv=json.load(open('ai_inventory.json'))
          matches=json.load(open('ai_search.json'))
          pairs=json.load(open('ai_pairs.json'))
          assert inv['unreviewed_ai_candidates']==18,inv
          assert inv['curated_promotions']==0
          assert inv['independent_proofs_verified']==0
          assert len(matches['results'])>0
          assert matches['results'][0]['verification_status']=='not_independently_verified'
          assert pairs['search_method']=='MCTS_cross_domain_candidate_pairs'
          assert len(pairs['results'])>=1
          assert all(x['conjecture_only'] and not x['proof_verified'] for x in pairs['results'])
          print('AI pack safely searchable and consumable by MCTS')
          PY
      - name: Reasoning and certificates
        run: python tests/test_reasoning.py
      - name: Finite quantifiers and guarded equality adversarial proof checks
        run: |
          python tests/test_logic_v6.py
          python tools/solve_logic.py examples/finite_quantifier_implication.json --output finite_proof.json
          python tools/solve_logic.py examples/finite_quantifier_implication.json --verify finite_proof.json
          python tools/solve_logic.py examples/conditional_guarded_equality.json --output guarded_proof.json
          python tools/solve_logic.py examples/conditional_guarded_equality.json --verify guarded_proof.json
          python - <<'PY'
          import json
          a=json.load(open("finite_proof.json"))
          b=json.load(open("guarded_proof.json"))
          assert a["certificate_replayed"] and a["instantiated_quantifier_cases"] == 2
          assert b["certificate_replayed"] and b["unverified_candidates"] == 1
          print("Finite instantiation and guarded prerequisites independently replayed")
          PY
      - name: Typed equational layer and independently replayed multi-logic certificates
        run: |
          python tests/test_equational.py
          python tools/solve_logic.py examples/equational_right_unit.json --output equational_proof_report.json
          python tools/solve_logic.py examples/equational_right_unit.json --verify equational_proof_report.json
          python - <<'PY'
          import json
          x=json.load(open("equational_proof_report.json"))
          assert x["logic"] == "equational"
          assert x["status"] == "proved_relative_to_equalities"
          assert x["certificate_replayed"]
          assert x["unverified_candidates"] == 1
          print("Typed term rewriting and source-bound replay passed")
          PY
      - name: Layered collision tests
        run: python tests/test_layered.py
      - name: Condition-boundary audits for additional 105 sourced Level1–3 math cards
        run: python tests/test_deep_level123.py
      - name: Catalog integration tests
        run: python tests/test_catalog.py
      - name: Level1–3 deep knowledge proof-path and attribution audits
        run: python tests/test_deep_core.py
      - name: Publish seven-domain Level1–3 reviewed-state coverage
        if: matrix.python-version == '3.12'
        run: python tools/audit_level123_depth.py --output level123_deep_audit.json
      - name: Imported knowledge adapter tests
        run: python tests/test_imported.py
      - name: Semantic mappings and structural audit tests
        run: python tests/test_semantic_audit.py
      - name: Large-index and typed-composition unit tests
        run: python tests/test_scale.py
      - name: Typed semantic graph and mathematics solver adversarial tests
        run: python tests/test_semantic_pipeline.py
      - name: Validate genuine set-transport 20x20 mathematical rule chains
        run: |
          python tests/test_set_transport20.py
          python tools/benchmark_set_transport.py --output set_transport_20x20.json --seeds 3 7 11
          python - <<'PY'
          import json
          x=json.load(open('set_transport_20x20.json'))
          assert x['missing_inclusion_rejected']
          for r in x['trials']:
              assert r['status']=='derived_relative_to_rules',r
              m=r['metrics']
              assert m['effective_goal_depth']==20
              assert m['applied_rules']==400
              assert all(layer['goal_relevant_knowledge']>=20
                         and layer['new_conclusions']==20 for layer in m['layers'])
          print('Set transport 20x20 proof replay and missing-premise attack passed')
          PY
      - name: Live Lean worker progress and hard deadline tests
        run: python tests/test_lean_heartbeat.py
      - name: Lean source-reference graph and adversarial tests
        run: python tests/test_lean_reference_index.py
      - name: Full corpus Lean planning and false-completion adversarial tests
        run: |
          python tests/test_full_lean_plan.py
          python tests/test_full_lean_coverage.py
          python tests/test_full_lean_import.py
      - name: Mathlib source extractor request tests
        run: python tests/test_mathlib_generator.py
      - name: Source module holdout and adaptive search tests
        run: python tests/test_lean_adaptive.py
      - name: Source-locked editorial promotion gate tests
        run: python tests/test_editorial.py
      - name: Compare mathematically sound rule-task solvers
        run: |
          python tools/semantic_pipeline.py --benchmark --iterations 220 --max-steps 12 --output semantic_benchmark.json
          python - <<'PY'
          import json
          x=json.load(open('semantic_benchmark.json'))
          assert len(x['scenarios'])==3
          for name,report in x['scenarios'].items():
              assert report['graph_complete'], name
              row={r['method']:r for r in report['methods']}
              for solver in ('bfs','beam'):
                  assert row[solver]['solved'] and row[solver]['certificate_replayed'], (name,solver,row)
              assert not row['mcts']['solved'] or row['mcts']['certificate_replayed'], name
          print('BFS/beam/MCTS concrete math task certificate audit passed')
          PY
      - name: Build a real 100k mathlib candidate index
        if: matrix.python-version == '3.12'
        run: python tools/build_search_index.py --db math_index.sqlite --candidate-limit 100000 --summary index_status.json
      - name: Validate and register imported source statements
        if: matrix.python-version == '3.12'
        run: python tools/register_source_statements.py --db math_index.sqlite --manifest official_source_registry.jsonl.gz --report source_registration_report.json
      - name: Module-disjoint train-validation-test split of source theorems
        if: matrix.python-version == '3.12'
        run: |
          python tools/build_lean_holdout.py --db math_index.sqlite --report lean_module_holdout.json
          python - <<'PY'
          import json
          d=json.load(open('lean_module_holdout.json'))
          assert d['source_theorems']==99984,d
          assert d['source_modules_spanning_multiple_splits']==0,d
          print('Module-disjoint source split:',d['split_counts'])
          PY
      - name: Plan ALL source-registered Lean theorems without exclusions hidden
        if: matrix.python-version == '3.12'
        run: |
          python tools/plan_full_lean.py --db math_index.sqlite --output mathlib_full_plan.json --report mathlib_full_plan_report.json --batch-limit 60
          python - <<'PY'
          import json
          plan=json.load(open('mathlib_full_plan.json'))
          assert plan["registered_total"] == 99984
          assert plan["scheduled_total"] + plan["unsupported_total"] == 99984
          assert plan["execution_status"] == "not_executed"
          assert sum(len(x["registered_declarations"]) for x in plan["batches"]) == plan["scheduled_total"]
          print("FULL mathlib planned; no unsupported source silently omitted:", plan["unsupported_total"])
          PY
      - name: Source registry integrity tests
        run: python tests/test_source_registry.py
      - name: Classified knowledge-layer regression tests
        run: python tests/test_knowledge_bank.py
      - name: Test pinned source attribution and originality boundaries
        run: python tests/test_attribution.py
      - name: Classify all 100k imported mathematics records
        if: matrix.python-version == '3.12'
        run: python tools/classify_knowledge.py --db math_index.sqlite --report knowledge_classification.json
      - name: Audit 49 mathematics fields against 100k classified source records
        if: matrix.python-version == '3.12'
        run: |
          python tools/audit_fields.py --indexed-db math_index.sqlite --output field_audit_100k.json --markdown field_audit_100k.md --ai-pack examples/field_replenishment_v1.json
          python - <<'PY'
          import json
          x=json.load(open("field_audit_100k.json"))
          assert x["taxonomy_fields"]==49,x
          assert x["ai_proposals_total_separate"]==35,x
          assert x["indexed_subset_evidence"].get("indexed_source_records",0)>90000,x
          assert all(row["indexed_imported_records"] is not None for row in x["fields"])
          assert all(row["independent_theorem_proof_count"] is None for row in x["fields"])
          print("Full indexed source-field classification audited; no kernel-proof claims")
          PY
      - name: Create citation index for all imported and curated cards
        if: matrix.python-version == '3.12'
        run: |
          python tools/build_attribution.py --db math_index.sqlite --report source_attribution_report.json
          python - <<'PY'
          import json, sqlite3
          result=json.load(open("source_attribution_report.json"))
          with sqlite3.connect("math_index.sqlite") as db:
              n=db.execute("SELECT COUNT(*) FROM documents").fetchone()[0]
          assert result["total_attributed_records"]==n
          assert result["by_source_kind"]["upstream_theorem"]==99984
          assert result["mathlib_license"]=="Apache-2.0"
          print("Full per-knowledge source citation coverage passed:",result)
          PY
      - name: Verify category coverage and independent rating
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('knowledge_classification.json').read_text())
          assert data['total_knowledge_records'] == data['curated_count'] + 100000, data
          assert data['source_knowledge_imported'] == 100000, data
          assert data['source_registered_theorems'] == 99984, data
          assert data['source_standard_cards_pending'] == 16, data
          assert data['importance_unrated_new_source_records'] == 100000
          assert data['difficulty_unrated_new_source_records'] == 100000
          assert sum(data['by_domain'].values()) == data['total_knowledge_records']
          from math_mcts.knowledge_bank import KnowledgeBank
          bank = KnowledgeBank('math_index.sqlite')
          assert bank.search('matrix', top_k=5), 'Indexed math statements should be searchable'
          assert bank.browse(domain='代数', limit=5), 'Normalized algebra category must be browsable'
          scope = bank.mcts_scope('matrix', max_concepts=30)
          assert 2 <= len(scope.concepts) <= 30
          assert all(c.id in scope.by_id for c in scope.concepts)
          print('FULL 100K CLASSIFICATION AND MCTS SCOPE PASSED', data['by_domain'])
          PY
      - name: Exhaustive mathematician attribution and reviewer-state tests
        run: python tests/test_review_backlog.py
      - name: Export all 99984 source-author-credit review records
        if: matrix.python-version == '3.12'
        run: |
          python tools/export_full_review_backlog.py --db math_index.sqlite --output full_source_review_backlog.jsonl.gz --report full_source_review_backlog_report.json
          python - <<'PY'
          import json
          r=json.load(open("full_source_review_backlog_report.json"))
          assert r['source_records']==99984
          assert r['human_reviewed']+r['not_human_reviewed']==99984
          assert r['lean_extracted']+r['lean_not_extracted']==99984
          print("Full credited review queue; no invented author and grade",r)
          PY
      - name: Knowledge quality review adversarial tests
        run: python tests/test_quality_review.py
      - name: Audit source knowledge and export review leads
        if: matrix.python-version == '3.12'
        run: |
          python tools/review_quality.py --db math_index.sqlite --report quality_triage_report.json --output quality_review_top1000.jsonl.gz --mode priority
          python tools/review_quality.py --db math_index.sqlite --read-only --mode anomaly --output quality_anomaly_top1000.jsonl.gz
          python tools/review_quality.py --db math_index.sqlite --read-only --mode duplicate --output quality_duplicates_top1000.jsonl.gz
      - name: Verify quality review invariants
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          data=json.loads(Path('quality_triage_report.json').read_text())
          assert data['source_knowledge_scanned']==100000, data
          assert data['importance_or_level_promoted']==0, data
          with sqlite3.connect('math_index.sqlite') as db:
              assert db.execute('SELECT COUNT(*) FROM knowledge_review_signals').fetchone()[0]==100000
              assert db.execute("SELECT COUNT(*) FROM classified_knowledge WHERE source_tier='unreviewed_import' AND (difficulty_level IS NOT NULL OR importance_status!='importance_unrated')").fetchone()[0]==0
          print('FULL SOURCE REVIEW AND ZERO-PROMOTION AUDIT PASSED', data)
          PY
      - name: Export 100k source-backed candidate review queue
        if: matrix.python-version == '3.12'
        run: python tools/export_review_queue.py --db math_index.sqlite --output source_review_queue.jsonl.gz --summary scale_status.json
      - name: Benchmark indexed retrieval
        if: matrix.python-version == '3.12'
        run: python tools/benchmark_fast_index.py --db math_index.sqlite --output fts_benchmark.json
      - name: Publish 100k scale data
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: source-candidates-100k
          path: |
            index_status.json
            official_source_registry.jsonl.gz
            source_registration_report.json
            lean_module_holdout.json
            mathlib_full_plan_report.json
            mathlib_full_plan.json
            full_source_review_backlog.jsonl.gz
            full_source_review_backlog_report.json
            knowledge_classification.json
            field_audit_100k.json
            field_audit_100k.md
            source_attribution_report.json
            level123_deep_audit.json
            quality_triage_report.json
            quality_review_top1000.jsonl.gz
            quality_anomaly_top1000.jsonl.gz
            quality_duplicates_top1000.jsonl.gz
            source_review_queue.jsonl.gz
            scale_status.json
            fts_benchmark.json
      - name: Full catalog audit
        run: python -m math_mcts.audit -o catalog_audit.json --fail-on-errors
      - name: Publish semantic search comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-math-bench-python-${{ matrix.python-version }}
          path: |
            semantic_benchmark.json
            set_transport_20x20.json
          if-no-files-found: ignore
      - name: Publish audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-audit-python-${{ matrix.python-version }}
          path: catalog_audit.json
          if-no-files-found: ignore
