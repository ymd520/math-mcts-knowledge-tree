name: Pinned mathlib declaration sample

concurrency:
  group: mathlib-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Deliberately manually triggered: fetching the full pinned mathlib cache is
# resource-intensive and is not required for the independently verified core
# Lean smoke test. A failed cache download must not be mistaken for a theorem
# extraction or silently block unrelated verified Python improvements.
on:
  pull_request:
    paths:
      - '.github/workflows/mathlib-sample.yml'
      - 'tools/bootstrap_pinned_mathlib.sh'
      - 'tools/generate_mathlib_extraction.py'
      - 'tools/generate_full_lean_batch.py'
      - 'math_mcts/full_lean_plan.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-matched-mathlib:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout pinned mathlib and verify its exact toolchain
        run: |
          set -euxo pipefail
          mkdir mathlib4
          git -C mathlib4 init
          git -C mathlib4 remote add origin https://github.com/leanprover-community/mathlib4.git
          git -C mathlib4 fetch --depth=1 origin 54c01c3314d33d15d77893cbe4e0472ff26bb34d
          git -C mathlib4 checkout --detach FETCH_HEAD
          test "$(git -C mathlib4 rev-parse HEAD)" = "54c01c3314d33d15d77893cbe4e0472ff26bb34d"
          test "$(cat mathlib4/lean-toolchain)" = "leanprover/lean4:v4.35.0-rc4"
      - name: Attribute pinned Mathlib module authors from real source file
        run: |
          python tools/verify_pinned_mathlib_credit.py \
            --mathlib-root mathlib4 --module Mathlib.Algebra.Group.Basic \
            --output pinned_mathlib_module_credit.json
          python - <<'PY'
          import json
          row=json.load(open('pinned_mathlib_module_credit.json'))
          assert row['source_commit']=="54c01c3314d33d15d77893cbe4e0472ff26bb34d"
          assert 'Jeremy Avigad' in row['file_header']['module_header_authors']
          assert row['file_header']['attribution_scope']=='module_file_header_not_individual_theorem'
          print('Pinned source file authorship verified (file header only)')
          PY
      - name: Prepare exact source Mathlib module with targeted cache and bounded fallback
        run: |
          bash -n tools/bootstrap_pinned_mathlib.sh
          cd mathlib4
          bash ../tools/bootstrap_pinned_mathlib.sh Mathlib/Algebra/Group/Basic.lean
      - name: Generate source-ID aligned requests from verified candidate corpus
        run: |
          python tools/build_search_index.py --db math_index.sqlite --candidate-limit 100000
          python tools/register_source_statements.py --db math_index.sqlite
          python tools/classify_knowledge.py --db math_index.sqlite
          python tools/generate_mathlib_extraction.py --db math_index.sqlite \
            --module-prefix Mathlib.Algebra.Group.Basic --limit 6 \
            --output lean/ExtractSelected.lean
          cp lean/ExtractSelected.lean mathlib4/ExtractSelected.lean
      - name: Extract real pinned mathlib environment declarations
        run: |
          set -o pipefail
          (cd mathlib4 && lake env lean ExtractSelected.lean) 2>&1 | tee pinned_mathlib_output.log
      - name: Smoke test Unicode-capable full-corpus Expr AST generator in actual pinned Mathlib
        run: |
          python tools/plan_full_lean.py --db math_index.sqlite --output mathlib_full_plan.json --report mathlib_full_plan_report.json --batch-limit 6
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open('mathlib_full_plan.json'))
          hits=[b for b in x['batches'] if b['module']=='Mathlib.Algebra.Group.Basic']
          assert hits, 'Pinned group module missing from full plan'
          Path('full_smoke_batch_id.txt').write_text(hits[0]['batch_id'])
          PY
          python tools/generate_full_lean_batch.py --plan mathlib_full_plan.json \
            --batch-id "$(cat full_smoke_batch_id.txt)" --output lean/FullSmoke.lean
          cp lean/FullSmoke.lean mathlib4/FullSmoke.lean
          set -o pipefail
          (cd mathlib4 && lake env lean FullSmoke.lean) 2>&1 | tee full_smoke_lean.log
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('full_smoke_lean.log').read_text().splitlines()
                if x.startswith('{') and '"source_statement_sha256"' in x]
          assert rows, 'No actual Lean source expression produced'
          assert all(type(x['leading_pi_binders'])==int and x['leading_pi_binders']>=0 for x in rows)
          assert all(x['elaborated_type_head'] in ('forallE','app','const','sort','other') for x in rows)
          print('Real Mathlib Elaborated Expr structural smoke:',len(rows))
          PY
      - name: Strictly check source-linked output and audit coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from math_mcts.lean_reference_index import import_lean_exports
          lines=Path('pinned_mathlib_output.log').read_text().splitlines()
          matching=[]
          missing=[]
          for line in lines:
              if not line.startswith('{'):
                  continue
              value=json.loads(line)
              if 'source_statement_sha256' in value:
                  matching.append(value)
              elif 'missing_declaration' in value:
                  missing.append(value)
          Path('mathlib_extracted.jsonl').write_text(
              ''.join(json.dumps(v,ensure_ascii=False)+'\n' for v in matching))
          Path('mathlib_missing.json').write_text(json.dumps(missing,indent=2))
          assert matching, ('All selected original declaration names missing; '
                            'do not claim extracted source coverage',missing)
          result=import_lean_exports('math_index.sqlite','mathlib_extracted.jsonl')
          Path('mathlib_alignment_report.json').write_text(json.dumps({
              'source_aligned':result, 'unresolved_declarations':missing,
              'selected_total':len(matching)+len(missing),
              'note':'Lean CI execution attested by workflow; JSON remains labeled external'
          },indent=2))
          print(result)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: pinned-mathlib-source-sample
          path: |
            pinned_mathlib_module_credit.json
            pinned_mathlib_output.log
            mathlib_extracted.jsonl
            mathlib_missing.json
            mathlib_alignment_report.json
            lean/ExtractSelected.lean
            lean/FullSmoke.lean
            full_smoke_lean.log
            mathlib_full_plan_report.json
          if-no-files-found: ignore
