name: Lean kernel extraction smoke

concurrency:
  group: lean-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'lean/**'
      - 'lean-toolchain'
      - '.github/workflows/lean-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elaborate-and-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Run Lean kernel declaration extraction on an actual elaborated theorem
        run: |
          lean --version
          set -o pipefail
          lean lean/ExtractCoreSmoke.lean 2>&1 | tee lean_core_extract.log
      - name: Validate emitted actual Lean environment references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lines=Path("lean_core_extract.log").read_text().splitlines()
          exported=[json.loads(s) for s in lines if s.startswith("{") and '"declaration"' in s]
          assert len(exported)==1, lines
          result=exported[0]
          assert result['declaration']=='mathMctsProofReferenceDemo', result
          assert 'Nat.add_zero' in result['proof_references'], result
          assert result['evidence']=='read_from_lean_environment'
          assert result['type_expression'].strip()
          print('Actual Lean environment type/proof reference extraction passed')
          PY
      - name: Verify elaborated binder and conclusion AST extraction
        run: |
          set -o pipefail
          lean lean/ExtractTypeStructureSmoke.lean 2>&1 | tee lean_type_structure_smoke.log
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(s) for s in Path('lean_type_structure_smoke.log').read_text().splitlines() if s.startswith('{')]
          assert len(rows)==1,rows
          record=rows[0]
          assert record['binder_count']>=3,record
          assert record['source']=='actual_elaborated_lean_expr'
          assert record['binders'][0]['domain_ast'] and record['conclusion_ast']
          print('REAL elaborated Lean type telescope and conclusion extraction PASS')
          PY
      - name: Check compatible and incompatible closed theorem premises in Lean Meta
        run: |
          set -o pipefail
          lean lean/TypeCompatibilitySmoke.lean 2>&1 | tee lean_defeq_smoke.log
          python - <<'PY'
          import json
          from pathlib import Path
          entries=[json.loads(line) for line in Path('lean_defeq_smoke.log').read_text().splitlines() if line.startswith('{')]
          assert len(entries)==1,entries
          assert entries[0]['actual_lean_meta_defeq']
          assert entries[0]['different_closed_premise_rejected']
          assert entries[0]['proof_of_remaining_conditions'] is False
          print('Actual Lean Meta defeq on closed propositions PASS; no full proof claim')
          PY
      - name: Resolve actual Lean theorem using constructor-built Name
        run: |
          set -o pipefail
          lean lean/NameFromStringSmoke.lean 2>&1 | tee lean_name_from_string_smoke.log
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('lean_name_from_string_smoke.log').read_text().splitlines() if x.startswith('{')]
          assert len(rows)==1 and rows[0]['resolved'],rows
          assert rows[0]['method']=='Lean.Name.str-fold'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-core-extraction-smoke
          path: |
            lean_core_extract.log
            lean_type_structure_smoke.log
            lean_defeq_smoke.log
            lean_name_from_string_smoke.log
          if-no-files-found: ignore
